name: GOAT
include:
  - .build/release-settings.yml
options:
  bundleIdPrefix: dev.leet
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    ARCHS: arm64  # Kid is Apple Silicon only; do not build an unused Intel slice.
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: NO   # dev builds; flips to YES in make release (ADR-0007)

packages:
  Modules:
    path: Modules
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: 2.4.0
  HighlightSwift:
    url: https://github.com/appstefan/HighlightSwift
    from: 1.0.0

targets:
  GOAT:
    type: application
    platform: macOS
    sources:
      - App/Sources
      - App/Assets.xcassets
      - path: art/spinner-light.png
        buildPhase: resources
      - path: art/spinner-dark.png
        buildPhase: resources
      - path: App/Resources/mermaid.min.js
        buildPhase: resources
      - path: App/Resources/Licenses
        buildPhase: resources
        type: folder
      - path: App/Resources/Skills
        buildPhase: resources
        type: folder
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSPrincipalClass: NSApplication
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: dev.leet.goat.package
            UTTypeDescription: GOATed Package
            UTTypeConformsTo: [public.zip-archive]
            UTTypeTagSpecification:
              public.filename-extension: [goated]
        NSLocalNetworkUsageDescription: "GOAT connects to the AI engines, MCP tools and Hindsight memory servers you configure on your local network, including Thunderbolt. It does not scan your network or send telemetry."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "GOAT. Private by design."
        GOATCodename: "$(GOAT_CODENAME)"
        GOATReleaseChannel: "$(GOAT_RELEASE_CHANNEL)"
        GOATSourceCommit: "$(GOAT_SOURCE_COMMIT)"
        GOATSourceTreeSHA256: "$(GOAT_SOURCE_TREE_SHA256)"
        GOATSourceDirty: "$(GOAT_SOURCE_DIRTY)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.leet.goat
        PRODUCT_NAME: GOAT
        ASSETCATALOG_COMPILER_APPICON_NAME: ProfessionalAppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: Modules
        product: Hoofprint
      - package: Modules
        product: Caprine
      - package: Modules
        product: Bleet
      - package: Modules
        product: GOATed
      - package: Modules
        product: Herd
      - package: Modules
        product: Hindsight
      - package: Modules
        product: Hitch
      - package: Modules
        product: Inference
      - package: Modules
        product: JUDAS
      - package: Modules
        product: MCPClient
      - package: Modules
        product: Memory
      - package: Modules
        product: Paddock
      - package: Modules
        product: Pens
      - package: Modules
        product: Persistence
      - package: Modules
        product: Pronk
      - package: Modules
        product: Shepherd
      - package: Modules
        product: Tools
      - package: MarkdownUI
        product: MarkdownUI
      - package: HighlightSwift
        product: HighlightSwift

  GOATTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - App/Tests
    dependencies:
      - target: GOAT
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.leet.goat.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/GOAT.app/Contents/MacOS/GOAT"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  GOAT:
    build:
      targets:
        GOAT: all
    test:
      targets:
        - GOATTests
      environmentVariables:
        GOAT_TEST_MODE: "1"
        GOAT_HOME: "$(PROJECT_TEMP_DIR)/GOATTestsHome"
