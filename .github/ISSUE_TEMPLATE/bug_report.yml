name: 🐐 Bug report
description: Something in GOAT misbehaves
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping the herd. Please fill in what you can. A clear repro is worth a thousand words.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what did GOAT do instead?
      placeholder: I asked for a mermaid diagram and the Paddock stayed blank…
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a chat
        2. …
        3. See the error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: GOAT version
      description: From the About box (⌘,-adjacent) or the activity-log crest.
      placeholder: 0.1 (Kid) · Candidate · build 1338
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "26.0 (Tahoe)"
    validations:
      required: true
  - type: input
    id: engine
    attributes:
      label: Engine + model
      description: Which local server and model were you running?
      placeholder: oMLX 1.x · Qwen3-30B-A3B-4bit
  - type: textarea
    id: activity-log
    attributes:
      label: Activity log
      description: Paste any relevant lines from the activity log (⌃`). Redact anything private.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Confirm
      options:
        - label: I've removed anything private (paths, keys, transcript text I don't want public).
          required: true
