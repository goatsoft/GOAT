name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/goat-macos

jobs:
  changes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    outputs:
      app: ${{ steps.changes.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Test change detection
        run: python3 -m unittest discover -s scripts/tests
      - name: Detect app changes
        id: changes
        run: python3 scripts/ci-changes.py

  # Style gate: swift-format is syntactic, so it needs no Xcode SDK and runs fast.
  lint:
    needs: changes
    # If detection fails or produces no output, retain full verification.
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install swift-format
        run: brew install swift-format
      - name: Lint
        run: make lint

  # App tests require the deployment OS as well as a compatible SDK.
  build-test:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Show toolchain
        run: |
          python3 scripts/check-release-host.py
          xcodebuild -version
          swift --version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Release verification
        run: make verify CONFIG=Release SWIFT_FLAGS='-c release'
      - name: Preserve failed app test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-test-results
          path: apps/goat-macos/.build/DerivedData/Logs/Test/*.xcresult
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run test:unit
      - name: Check distribution notices
        run: python3 ../scripts/distribution-notices.py --check
      - name: Check module documentation
        run: python3 ../apps/goat-macos/scripts/sync-module-docs.py --check
      - run: npm run build:all
      - run: npm run check:content
